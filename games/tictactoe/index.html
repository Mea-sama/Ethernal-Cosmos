<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TicTacToe — Ethernal Cosmos</title>
  <link rel="stylesheet" href="/tictactoe/styles.css">
</head>
<body>
  <h1>✕ TicTacToe ○</h1>
  <div id="status">Verbinde...</div>

  <!-- ── Login / Register screen ── -->
  <div class="screen" id="s-auth">
    <div class="tab-bar">
      <button id="tab-login" class="active">Anmelden</button>
      <button id="tab-reg">Registrieren</button>
    </div>
    <div class="field">
      <label>Benutzername</label>
      <input id="auth-user" type="text" autocomplete="username" placeholder="dein_name">
    </div>
    <div class="field">
      <label>Passwort</label>
      <input id="auth-pass" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="btn" id="btn-auth">Anmelden</button>
    <p class="small" id="auth-err"></p>
  </div>

  <!-- ── Lobby screen ── -->
  <div class="screen hidden" id="s-lobby">
    <button class="btn" id="btn-create">Neues Spiel erstellen</button>
    <div class="divider">oder beitreten</div>
    <input class="code-input" id="code-in" maxlength="6" placeholder="Code eingeben">
    <button class="btn ghost" id="btn-join">Beitreten</button>
  </div>

  <!-- ── Waiting screen (host) ── -->
  <div class="screen hidden" id="s-wait">
    <div class="code-box">
      <div class="label">Einladungscode</div>
      <div class="code" id="invite-code">------</div>
      <div class="hint">Teile diesen Code mit deinem Gegner</div>
    </div>
    <button class="btn ghost" id="btn-copy">📋 Code kopieren</button>
    <p class="small" id="wait-msg">Warte auf Gegner...</p>
    <button class="btn ghost" id="btn-cancel-wait">Abbrechen</button>
  </div>

  <!-- ── Game screen ── -->
  <div class="screen hidden" id="s-game">
    <div class="players">
      <div class="p-card x" id="card-x">
        <div class="sym">✕</div>
        <div class="name" id="name-x">—</div>
      </div>
      <div class="vs">VS</div>
      <div class="p-card o" id="card-o">
        <div class="sym">○</div>
        <div class="name" id="name-o">—</div>
      </div>
    </div>

    <div id="turn"></div>
    <div id="board"></div>
    <div id="result-box" class="hidden"></div>
    <button class="btn ghost mt-xs" id="btn-leave-game">Spiel verlassen</button>
  </div>

  <script src="/assets/socket.io.min.js"></script>
  <script src="/assets/panel.js"></script>
  <script src="/tictactoe/app.js"></script>
</body>
</html>
